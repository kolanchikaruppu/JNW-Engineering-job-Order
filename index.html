<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JNW Engineering Job Order</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --primary: #17466f;
      --primary-dark: #0f304d;
      --accent: #c82f2f;
      --text: #222;
      --muted: #606975;
      --surface: #f4f6f8;
      --border: #d8dee6;
      --radius: 4px;
      --font: "Segoe UI", Arial, sans-serif;
    }
    body {
      margin: 0;
      background: #eef2f5;
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
    }
    .app {
      width: min(980px, calc(100% - 1rem));
      margin: 1rem auto 2rem;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(20, 35, 50, 0.08);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 2px solid var(--primary-dark);
    }
    .brand img {
      width: 300px;
      max-width: 100%;
      height: auto;
      display: block;
    }
    .job-number {
      display: grid;
      gap: 0.25rem;
      min-width: 190px;
    }
    label span,
    .job-number label,
    .canvas-head span {
      color: #111;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .job-number label {
      color: #111;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .job-number input {
      color: var(--accent);
      border: 0;
      border-bottom: 2px solid var(--border);
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 0.15rem 0;
    }
    .actions {
      position: static;
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      padding: 1.2rem 1rem 1.6rem;
      background: #fff;
      border-bottom: 0;
    }
    button {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--primary-dark);
      cursor: pointer;
      font-family: var(--font);
      font-weight: 700;
    }
    .actions .primary {
      width: min(220px, 70%);
    }
    .actions .secondary {
      min-width: 120px;
      padding: 0 1rem;
    }
    .primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .danger { color: var(--accent); }
    .hidden-control {
      display: none;
    }
    .server-note {
      display: none;
      margin: 0.6rem 1rem 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }
    .status {
      display: none;
    }
    fieldset {
      display: grid;
      gap: 0.85rem;
      margin: 0.9rem 1rem;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #fff;
    }
    legend {
      display: none;
    }
    label,
    .canvas-head {
      display: grid;
      gap: 0.3rem;
    }
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      padding: 0.72rem 0.78rem;
    }
    textarea {
      min-height: 88px;
      resize: vertical;
    }
    input:focus,
    textarea:focus {
      outline: 2px solid rgba(23, 70, 111, 0.16);
      border-color: var(--primary);
    }
    input[readonly] {
      background: var(--surface);
      font-weight: 800;
    }
    .plain-label > span {
      display: inline;
    }
    .grid {
      display: grid;
      gap: 0.85rem;
    }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .parts-table {
      display: grid;
      gap: 0.45rem;
    }
    .parts-head,
    .part-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) 130px 86px;
      gap: 0.45rem;
      align-items: center;
    }
    .parts-head {
      color: #111;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .parts-head span:nth-child(3) { grid-column: span 2; }
    .add-row {
      justify-self: start;
      padding: 0 0.85rem;
    }
    .remove-row,
    .clear-sign {
      display: none;
    }
    .remove-row {
      font-size: 0.8rem;
    }
    .signature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .canvas-head {
      grid-template-columns: 1fr auto;
      align-items: center;
      margin-bottom: 0.35rem;
    }
    .clear-sign {
      min-height: 34px;
      padding: 0 0.65rem;
      color: var(--accent);
    }
    .history-panel {
      display: grid;
      gap: 0.75rem;
      margin: 0.9rem 1rem;
      padding: 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .history-panel[hidden] {
      display: none;
    }
    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .history-title {
      color: #111;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .history-tools {
      display: flex;
      gap: 0.45rem;
    }
    .history-tools button {
      min-height: 34px;
      padding: 0 0.7rem;
    }
    .history-list {
      display: grid;
      gap: 0.55rem;
    }
    .history-empty {
      color: var(--muted);
      font-weight: 700;
    }
    .history-card {
      display: grid;
      gap: 0.35rem;
      padding: 0.65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #fff;
    }
    .history-card strong {
      color: #111;
      font-size: 0.9rem;
    }
    .history-card span,
    .history-card p {
      margin: 0;
      color: var(--text);
      font-size: 0.88rem;
    }
    .history-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.85rem;
      color: var(--muted);
      font-weight: 700;
    }
    canvas {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: linear-gradient(#fff 92%, #e6ebf0 92%);
      touch-action: none;
    }
    @media (max-width: 760px) {
      body { background: #fff; }
      .app {
        width: 100%;
        margin: 0;
        border: 0;
        box-shadow: none;
      }
      .topbar {
        align-items: flex-start;
        flex-direction: column;
        padding: 0.9rem;
      }
      .brand img {
        width: 230px;
      }
      .job-number {
        width: 100%;
        min-width: 0;
      }
      .actions {
        display: flex;
        padding: 0.6rem 0.9rem;
      }
      .actions button {
        flex: 0 1 220px;
      }
      .history-head {
        align-items: flex-start;
        flex-direction: column;
      }
      fieldset {
        margin: 0.85rem 0.75rem;
        padding: 0;
      }
      .two,
      .three,
      .signature-grid {
        grid-template-columns: 1fr;
      }
      .part-row {
        grid-template-columns: 68px 1fr;
        padding: 0.7rem;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      .part-row input[name="partDescription"],
      .part-row input[name="partCharge"],
      .part-row .remove-row {
        grid-column: 1 / -1;
      }
    }
    @media print {
      @page { size: A4 portrait; margin: 7mm; }
      *, *::before, *::after {
        box-shadow: none !important;
      }
      html,
      body {
        width: 100%;
        background: #fff;
        font-size: 8.5px;
        line-height: 1.2;
      }
      .no-print { display: none !important; }
      .app {
        width: 100%;
        margin: 0;
        border: 0;
        box-shadow: none;
      }
      .topbar {
        display: flex;
        align-items: center;
        flex-direction: row;
        justify-content: space-between;
        gap: 0.12in;
        padding: 0 0 0.07in;
        border-bottom-width: 1px;
      }
      .brand img { width: 1.9in; }
      .job-number {
        width: auto;
        gap: 0.02in;
        min-width: 1.35in;
      }
      .job-number input {
        font-size: 15px;
        padding: 0.01in 0;
      }
      fieldset {
        break-inside: avoid;
        gap: 0.035in;
        margin: 0 0 0.045in;
        padding: 0;
      }
      legend {
        padding: 0;
        font-size: 10px;
        line-height: 1.1;
      }
      label,
      .canvas-head {
        gap: 0.015in;
      }
      label span,
      .job-number label,
      .canvas-head span,
      .parts-head {
        font-size: 8px;
        line-height: 1.1;
      }
      .grid {
        gap: 0.055in;
      }
      .two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      input,
      textarea {
        border: 1px solid #b8c1cc;
        border-radius: 2px;
        font-size: 9px;
        line-height: 1.2;
        padding: 0.035in 0.045in;
      }
      textarea {
        min-height: 0.34in;
        resize: none;
      }
      textarea[name="complaint"] { min-height: 0.42in; }
      textarea[name="actionTaken"] { min-height: 0.62in; }
      textarea[name="remarks"] { min-height: 0.42in; }
      .parts-table {
        gap: 0.025in;
      }
      .parts-head,
      .part-row {
        grid-template-columns: 0.55in minmax(0, 1fr) 0.95in 0;
        gap: 0.055in;
        align-items: center;
      }
      .part-row {
        padding: 0;
        border: 0;
        border-radius: 0;
        background: #fff;
      }
      .part-row input[name="partDescription"],
      .part-row input[name="partCharge"],
      .part-row .remove-row {
        grid-column: auto;
      }
      .part-row input {
        min-height: 0.27in;
      }
      .signature-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.12in;
      }
      .canvas-head {
        margin-bottom: 0.025in;
      }
      canvas {
        height: 0.72in !important;
        min-height: 0;
        border-color: #b8c1cc;
      }
    }
  </style>
</head>
<body>
  <form class="app" id="jobForm">
    <div class="topbar">
      <div class="brand">
        <img src="JNW.png" alt="JNW Engineering Pte Ltd" />
      </div>
      <div class="job-number">
        <label for="jobOrder">Job Order</label>
        <input id="jobOrder" name="jobOrder" readonly />
      </div>
    </div>

    <p class="status no-print" id="saveStatus" role="status" aria-live="polite">Draft saves on this device.</p>
    <p class="server-note no-print" id="serverNote">Open this form from the Job Order server to submit reports into OneDrive.</p>

    <fieldset>
      <div class="grid two">
        <label><span>Company</span><input name="company" autocomplete="organization" /></label>
        <label><span>Date</span><input name="date" type="date" /></label>
        <label><span>Requested By</span><input name="requestedBy" autocomplete="name" /></label>
      </div>
    </fieldset>

    <fieldset>
      <label><span>Complaint</span><textarea name="complaint" rows="3"></textarea></label>
      <label><span>Action Taken</span><textarea name="actionTaken" rows="5"></textarea></label>
    </fieldset>

    <fieldset>
      <div class="parts-table" id="partsList">
        <div class="parts-head">
          <span>S/No</span>
          <span>Materials and Parts Used</span>
          <span>Quantity</span>
        </div>
      </div>
      <button type="button" class="add-row no-print" id="addPartBtn">Add item</button>
    </fieldset>

    <fieldset>
      <div class="grid three">
        <label><span>Labour Description</span><input name="labourDescription" /></label>
        <label><span>Man</span><input name="labourMan" type="number" min="0" step="1" inputmode="numeric" /></label>
        <label><span>Hours</span><input name="labourHours" type="number" min="0" step="0.5" inputmode="decimal" /></label>
      </div>
    </fieldset>

    <fieldset>
      <label><span>Remarks</span><textarea name="remarks" rows="3"></textarea></label>
    </fieldset>

    <fieldset>
      <div class="signature-grid">
        <div>
          <div class="canvas-head">
            <span>Customer Signature and Chop</span>
            <button type="button" class="clear-sign no-print" data-clear="customerSignature">Clear</button>
          </div>
          <canvas id="customerSignature" width="600" height="220"></canvas>
        </div>
        <div>
          <div class="canvas-head">
            <span>Technician Signature</span>
            <button type="button" class="clear-sign no-print" data-clear="technicianSignature">Clear</button>
          </div>
          <canvas id="technicianSignature" width="600" height="220"></canvas>
        </div>
      </div>
    </fieldset>

    <section class="history-panel no-print" id="historyPanel" hidden>
      <div class="history-head">
        <div class="history-title">History</div>
        <div class="history-tools">
          <button type="button" id="clearHistoryBtn" class="danger">Clear History</button>
          <button type="button" id="closeHistoryBtn">Close</button>
        </div>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

    <div class="actions no-print">
      <button type="button" class="primary" id="saveBtn">Submit</button>
      <button type="button" class="secondary" id="historyBtn">History</button>
      <button type="button" class="hidden-control" id="printBtn">Print</button>
      <button type="button" class="hidden-control" id="shareBtn">Share</button>
      <button type="button" class="hidden-control danger" id="clearBtn">Clear</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('jobForm');
    const partsList = document.getElementById('partsList');
    const addPartBtn = document.getElementById('addPartBtn');
    const saveBtn = document.getElementById('saveBtn');
    const historyBtn = document.getElementById('historyBtn');
    const printBtn = document.getElementById('printBtn');
    const shareBtn = document.getElementById('shareBtn');
    const clearBtn = document.getElementById('clearBtn');
    const historyPanel = document.getElementById('historyPanel');
    const historyList = document.getElementById('historyList');
    const serverNote = document.getElementById('serverNote');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const closeHistoryBtn = document.getElementById('closeHistoryBtn');
    const saveStatus = document.getElementById('saveStatus');
    const storageKey = 'jnw-standalone-mobile-job-order-v5';
    const sequenceKey = 'jnw-standalone-mobile-job-order-next-number';
    const historyKey = 'jnw-standalone-mobile-job-order-history';
    const signatureCanvases = ['customerSignature', 'technicianSignature'];
    const officeServerUrl = 'http://192.168.10.38:4322/';
    const isGithubPage = location.hostname.endsWith('github.io');
    const isServerMode = location.protocol === 'http:' || location.protocol === 'https:';

    if (isGithubPage) {
      document.body.innerHTML = '<main style="font-family: Segoe UI, Arial, sans-serif; padding: 24px; line-height: 1.5;"><h1>Opening JNW Job Order...</h1><p>Please wait. This page will open the office Job Order server.</p><p><a href="' + officeServerUrl + '">Open JNW Job Order</a></p></main>';
      location.replace(officeServerUrl);
    }

    const setStatus = (message) => { saveStatus.textContent = message; };
    const formatJobNumber = (number) => {
      const parsedNumber = Number.parseInt(number, 10);
      return Number.isFinite(parsedNumber) ? String(Math.max(1, parsedNumber)).padStart(2, '0') : String(number);
    };
    const nextJobNumber = () => {
      const storedNumber = Number.parseInt(localStorage.getItem(sequenceKey), 10);
      return Number.isFinite(storedNumber) && storedNumber > 0 ? storedNumber : 1;
    };
    const setJobOrderNumber = (number = nextJobNumber()) => {
      form.elements.jobOrder.value = formatJobNumber(number);
    };
    const advanceJobOrderNumber = () => {
      const currentNumber = Number.parseInt(form.elements.jobOrder.value, 10) || nextJobNumber();
      const nextNumber = currentNumber + 1;
      localStorage.setItem(sequenceKey, String(nextNumber));
      return nextNumber;
    };
    const fetchServerJobNumber = async () => {
      if (!isServerMode) {
        serverNote.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('/api/next-job-order', { cache: 'no-store' });
        if (!response.ok) return;
        const data = await response.json();
        setJobOrderNumber(data.nextJobOrder);
      } catch {
        serverNote.style.display = 'block';
      }
    };
    const todayDateValue = () => {
      const today = new Date();
      today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
      return today.toISOString().slice(0, 10);
    };
    const setCurrentDate = () => {
      form.elements.date.value = todayDateValue();
    };
    const moneyValue = (value) => {
      const number = Number.parseFloat(value);
      return Number.isFinite(number) ? number : 0;
    };
    const escapeAttr = (value) => String(value || '').replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

    const calculateTotal = () => {
      const partTotal = Array.from(partsList.querySelectorAll('[name="partCharge"]'))
        .reduce((sum, input) => sum + moneyValue(input.value), 0);
      return partTotal;
    };

    const collectData = () => {
      const data = Object.fromEntries(new FormData(form).entries());
      data.parts = Array.from(partsList.querySelectorAll('.part-row')).map((row) => ({
        serial: row.querySelector('[name="partSerial"]').value,
        description: row.querySelector('[name="partDescription"]').value,
        quantity: row.querySelector('[name="partCharge"]').value,
        charge: row.querySelector('[name="partCharge"]').value,
      }));
      data.signatures = Object.fromEntries(signatureCanvases.map((id) => {
        const canvas = document.getElementById(id);
        return [id, canvas.toDataURL('image/png')];
      }));
      return data;
    };

    const collectHistoryEntry = () => {
      const data = collectData();
      delete data.signatures;
      data.savedAt = new Date().toISOString();
      return data;
    };

    const readHistory = () => {
      try {
        const history = JSON.parse(localStorage.getItem(historyKey) || '[]');
        return Array.isArray(history) ? history : [];
      } catch {
        return [];
      }
    };

    const writeHistory = (history) => {
      localStorage.setItem(historyKey, JSON.stringify(history.slice(0, 100)));
    };

    const saveHistoryEntry = () => {
      const entry = collectHistoryEntry();
      const history = readHistory().filter((item) => item.jobOrder !== entry.jobOrder);
      writeHistory([entry, ...history]);
    };

    const renderHistory = () => {
      const history = readHistory();
      if (!history.length) {
        historyList.innerHTML = '<div class="history-empty">No saved job orders on this device.</div>';
        return;
      }

      historyList.innerHTML = history.map((entry) => {
        const parts = (entry.parts || [])
          .filter((part) => part.description || part.charge)
          .map((part) => `${escapeAttr(part.serial)}. ${escapeAttr(part.description)}${part.charge ? ` - Qty ${escapeAttr(part.charge)}` : ''}`)
          .join('<br>');
        const savedDate = entry.savedAt ? new Date(entry.savedAt).toLocaleString() : '';
        return `
          <article class="history-card">
            <strong>Job Order ${escapeAttr(entry.jobOrder)}</strong>
            <div class="history-meta">
              <span>Date: ${escapeAttr(entry.date)}</span>
              <span>Saved: ${escapeAttr(savedDate)}</span>
            </div>
            <p><strong>Company:</strong> ${escapeAttr(entry.company)}</p>
            <p><strong>Requested By:</strong> ${escapeAttr(entry.requestedBy)}</p>
            <p><strong>Complaint:</strong> ${escapeAttr(entry.complaint)}</p>
            <p><strong>Action Taken:</strong> ${escapeAttr(entry.actionTaken)}</p>
            <p><strong>Materials:</strong><br>${parts || 'None'}</p>
            <p><strong>Labour:</strong> ${escapeAttr(entry.labourDescription)} ${escapeAttr(entry.labourMan)} man ${escapeAttr(entry.labourHours)} hours</p>
            <p><strong>Remarks:</strong> ${escapeAttr(entry.remarks)}</p>
          </article>
        `;
      }).join('');
    };

    const saveDraft = (showMessage = false) => {
      calculateTotal();
      localStorage.setItem(storageKey, JSON.stringify(collectData()));
      if (showMessage) {
        setStatus(`Saved ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`);
      }
    };

    const clearSignatures = () => {
      signatureCanvases.forEach((id) => {
        const canvas = document.getElementById(id);
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      });
    };

    const prepareBlankJobOrder = (number = nextJobNumber()) => {
      form.reset();
      setJobOrderNumber(number);
      setCurrentDate();
      partsList.querySelectorAll('.part-row').forEach((row) => row.remove());
      addPartRow();
      clearSignatures();
      calculateTotal();
      saveDraft();
    };

    const printJobOrder = (jobNumber) => {
      saveDraft();
      const originalTitle = document.title;
      document.title = `JNW Job Order ${jobNumber}`;
      window.print();
      document.title = originalTitle;
    };

    const saveAsPdf = () => {
      const jobNumber = form.elements.jobOrder.value || formatJobNumber(nextJobNumber());
      saveHistoryEntry();
      printJobOrder(jobNumber);
      const nextNumber = advanceJobOrderNumber();
      localStorage.removeItem(storageKey);
      prepareBlankJobOrder(nextNumber);
      setStatus(`Saved job order ${jobNumber}. Next job order ${formatJobNumber(nextNumber)} is ready.`);
    };

    const submitToOneDrive = async () => {
      if (!isServerMode) {
        alert('Please open the server link first. Direct file links cannot submit reports into OneDrive.');
        return;
      }

      saveDraft();
      saveBtn.disabled = true;
      try {
        const response = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(collectData()),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Submit failed.');

        saveHistoryEntry();
        localStorage.removeItem(storageKey);
        prepareBlankJobOrder(Number(result.nextJobOrder || nextJobNumber()));
        alert(`Submitted job order ${result.jobOrder}.\nSaved in OneDrive Reports folder.`);
        await fetchServerJobNumber();
      } catch (error) {
        alert(`Could not submit to OneDrive.\n${error.message || 'Please check the server is running.'}`);
      } finally {
        saveBtn.disabled = false;
      }
    };

    const renumberPartRows = () => {
      partsList.querySelectorAll('.part-row').forEach((row, index) => {
        row.querySelector('[name="partSerial"]').value = index + 1;
      });
    };

    const addPartRow = (part = {}) => {
      const row = document.createElement('div');
      row.className = 'part-row';
      row.innerHTML = `
        <input name="partSerial" inputmode="numeric" aria-label="Serial number" value="${escapeAttr(part.serial)}" readonly />
        <input name="partDescription" aria-label="Material or part used" value="${escapeAttr(part.description)}" />
        <input name="partCharge" type="number" min="0" step="1" inputmode="numeric" aria-label="Quantity" value="${escapeAttr(part.charge)}" />
        <button type="button" class="remove-row no-print" aria-label="Remove item">Remove</button>
      `;
      row.querySelector('.remove-row').addEventListener('click', () => {
        row.remove();
        renumberPartRows();
        saveDraft(true);
      });
      row.querySelectorAll('input').forEach((input) => input.addEventListener('input', () => saveDraft()));
      partsList.append(row);
      renumberPartRows();
    };

    const restoreSignature = (id, imageData) => {
      if (!imageData) return;
      const canvas = document.getElementById(id);
      const context = canvas.getContext('2d');
      const image = new Image();
      image.onload = () => {
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(image, 0, 0, canvas.width / window.devicePixelRatio, canvas.height / window.devicePixelRatio);
      };
      image.src = imageData;
    };

    const setupSignature = (id) => {
      const canvas = document.getElementById(id);
      const context = canvas.getContext('2d');
      let drawing = false;

      const resizeCanvas = () => {
        const image = canvas.toDataURL('image/png');
        const width = canvas.offsetWidth;
        const height = Math.max(150, Math.round(width * 0.34));
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        canvas.style.height = `${height}px`;
        context.scale(window.devicePixelRatio, window.devicePixelRatio);
        context.lineWidth = 2;
        context.lineCap = 'round';
        context.strokeStyle = '#111';
        restoreSignature(id, image);
      };

      const point = (event) => {
        const rect = canvas.getBoundingClientRect();
        const touch = event.touches?.[0] || event;
        return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
      };
      const start = (event) => {
        event.preventDefault();
        drawing = true;
        const p = point(event);
        context.beginPath();
        context.moveTo(p.x, p.y);
      };
      const move = (event) => {
        if (!drawing) return;
        event.preventDefault();
        const p = point(event);
        context.lineTo(p.x, p.y);
        context.stroke();
      };
      const stop = () => {
        if (!drawing) return;
        drawing = false;
        saveDraft(true);
      };

      canvas.addEventListener('mousedown', start);
      canvas.addEventListener('mousemove', move);
      canvas.addEventListener('mouseup', stop);
      canvas.addEventListener('mouseleave', stop);
      canvas.addEventListener('touchstart', start, { passive: false });
      canvas.addEventListener('touchmove', move, { passive: false });
      canvas.addEventListener('touchend', stop);
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
    };

    const loadDraft = () => {
      localStorage.removeItem(storageKey);
      prepareBlankJobOrder();
      return;

      const raw = localStorage.getItem(storageKey);
      if (!raw) {
        prepareBlankJobOrder();
        return;
      }
      try {
        const data = JSON.parse(raw);
        Object.entries(data).forEach(([key, value]) => {
          if (key === 'parts' || key === 'signatures') return;
          if (form.elements[key]) form.elements[key].value = value;
        });
        setJobOrderNumber(form.elements.jobOrder.value || nextJobNumber());
        setCurrentDate();
        (data.parts?.length ? data.parts : [{}]).forEach(addPartRow);
        requestAnimationFrame(() => signatureCanvases.forEach((id) => restoreSignature(id, data.signatures?.[id])));
        calculateTotal();
        setStatus('Draft restored from this device.');
      } catch {
        addPartRow();
        calculateTotal();
        setStatus('Draft could not be restored.');
      }
    };

    form.addEventListener('input', () => saveDraft());
    addPartBtn.addEventListener('click', () => {
      addPartRow();
      saveDraft(true);
    });
    saveBtn.addEventListener('click', submitToOneDrive);
    historyBtn.addEventListener('click', () => {
      renderHistory();
      historyPanel.hidden = !historyPanel.hidden;
      if (!historyPanel.hidden) historyPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    closeHistoryBtn.addEventListener('click', () => {
      historyPanel.hidden = true;
    });
    clearHistoryBtn.addEventListener('click', () => {
      if (!confirm('Clear job order history saved on this device?')) return;
      localStorage.removeItem(historyKey);
      renderHistory();
      setStatus('History cleared.');
    });
    printBtn.addEventListener('click', () => {
      saveDraft();
      window.print();
    });
    shareBtn.addEventListener('click', async () => {
      saveDraft();
      const data = collectData();
        const text = `JNW Job Order ${data.jobOrder || ''}\nCompany: ${data.company || ''}\nDate: ${data.date || ''}\nComplaint: ${data.complaint || ''}\nAction Taken: ${data.actionTaken || ''}`;
      if (navigator.share) {
        await navigator.share({ title: `JNW Job Order ${data.jobOrder || ''}`, text });
        return;
      }
      await navigator.clipboard.writeText(text);
      setStatus('Job summary copied.');
    });
    clearBtn.addEventListener('click', () => {
      if (!confirm('Clear this job order draft on this device?')) return;
      localStorage.removeItem(storageKey);
      prepareBlankJobOrder();
      setStatus('Draft cleared.');
    });
    document.querySelectorAll('.clear-sign').forEach((button) => {
      button.addEventListener('click', () => {
        const canvas = document.getElementById(button.dataset.clear);
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        saveDraft(true);
      });
    });

    signatureCanvases.forEach(setupSignature);
    loadDraft();
    fetchServerJobNumber();
  </script>
</body>
</html>
